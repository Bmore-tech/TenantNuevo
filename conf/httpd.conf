# ============================================================================
# httpd.conf mínimo para el relay WebDAV de CitiDirect.
# Solo carga los módulos necesarios. Todo está denegado salvo:
#   /health          -> sin autenticación (Health check de App Service)
#   /<archivo>       -> WebDAV con Basic Auth en la RAÍZ (así entrega CitiDirect hoy:
#                       "PUT /IDET_COZUMEL202610191507")
#   /banco/ /BANCO/  -> alias a la misma bandeja (compatibilidad)
# ============================================================================

ServerRoot "/usr/local/apache2"
Listen 80
ServerName localhost

LoadModule mpm_event_module      modules/mod_mpm_event.so
<IfModule !unixd_module>
    LoadModule unixd_module      modules/mod_unixd.so
</IfModule>
LoadModule authn_core_module     modules/mod_authn_core.so
LoadModule authn_file_module     modules/mod_authn_file.so
LoadModule authz_core_module     modules/mod_authz_core.so
LoadModule authz_user_module     modules/mod_authz_user.so
LoadModule authz_host_module     modules/mod_authz_host.so
LoadModule auth_basic_module     modules/mod_auth_basic.so
LoadModule reqtimeout_module     modules/mod_reqtimeout.so
LoadModule mime_module           modules/mod_mime.so
LoadModule log_config_module     modules/mod_log_config.so
LoadModule headers_module        modules/mod_headers.so
LoadModule dir_module            modules/mod_dir.so
LoadModule alias_module          modules/mod_alias.so
LoadModule dav_module            modules/mod_dav.so
LoadModule dav_fs_module         modules/mod_dav_fs.so
LoadModule allowmethods_module   modules/mod_allowmethods.so

User  www-data
Group www-data

# ---- Endurecimiento ---------------------------------------------------------
ServerTokens Prod
ServerSignature Off
TraceEnable Off
FileETag MTime Size
Timeout 300
RequestReadTimeout header=20-40,MinRate=500 body=60,MinRate=500
LimitRequestBody ${MAX_UPLOAD_BYTES}

# /home en App Service es un recurso compartido de red: desactivar mmap/sendfile.
EnableMMAP Off
EnableSendfile Off

Header always set X-Content-Type-Options "nosniff"
Header always unset X-Powered-By
RequestHeader unset Proxy early

# ---- Logs a stdout/stderr (Log Stream). Nunca se registra Authorization. ---
ErrorLog /proc/self/fd/2
LogLevel warn
LogFormat "%{X-Forwarded-For}i %u %t \"%r\" %>s %b %Dus" relay
CustomLog /proc/self/fd/1 relay

TypesConfig conf/mime.types

# ---- Todo denegado por defecto ---------------------------------------------
# La raíz del sitio es la bandeja de CitiDirect (igual que el Apache original).
DocumentRoot "${INBOX_DIR}"
<Directory />
    Options None
    AllowOverride None
    Require all denied
</Directory>

<Files ".ht*">
    Require all denied
</Files>

# ---- Health check (sin autenticación, sin información) ---------------------
Alias /health "/usr/local/apache2/health/index.html"
<Directory "/usr/local/apache2/health">
    Require all granted
</Directory>

# ---- WebDAV para CitiDirect -------------------------------------------------
DavLockDB "/var/lib/apache-dav/DavLock"

# Además de la raíz, acepta /banco/, /BANCO/, /Banco/ ...
AliasMatch "(?i)^/banco(/.*)?$" "${INBOX_DIR}$1"

<Directory "${INBOX_DIR}">
    Dav On
    Options None
    AllowOverride None
    DirectoryIndex disabled

    AuthType Basic
    AuthName "webdav"
    AuthBasicProvider file
    AuthUserFile "/usr/local/apache2/auth/.htpasswd"
    Require valid-user

    # CitiDirect solo usa PUT. Se permiten además los métodos de lectura/WebDAV
    # básicos para pruebas de conectividad; DELETE, MOVE, COPY, MKCOL y
    # PROPPATCH quedan bloqueados (nadie puede borrar o mover archivos pendientes).
    # (mod_allowmethods: responde 405 a cualquier otro método)
    AllowMethods GET HEAD OPTIONS PUT PROPFIND LOCK UNLOCK
</Directory>
