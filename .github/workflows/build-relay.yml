name: Build, Push to ACR and Deploy CitiDirect Relay

on:
  push:
    branches: main
  workflow_dispatch:

permissions:
  contents: read

env:
  ACR_NAME: presidentebanamex
  ACR_LOGIN_SERVER: presidentebanamex.azurecr.io
  IMAGE_NAME: citidirect-relay
  WEBAPP_NAME: apache-tesoreria-presidente2     # <-- AJUSTAR
  VERSION_BASE: "1.0"

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Calcular versión
        id: version
        run: echo "version=${{ env.VERSION_BASE }}.${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      - name: Login a Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Login al ACR
        run: az acr login --name ${{ env.ACR_NAME }}

      - uses: docker/setup-buildx-action@v3

      - name: Construir y publicar imagen
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.version }}
            ${{ env.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

      - name: Desplegar en Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.WEBAPP_NAME }}
          images: ${{ env.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.version }}

      - name: Logout de Azure
        if: always()
        run: az logout
